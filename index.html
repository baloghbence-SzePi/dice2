<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtuális Kérdéskocka – 6 kérdőszó</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes diceTumble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(-9deg) scale(1.05); }
      40%  { transform: rotate(8deg) scale(1.07); }
      60%  { transform: rotate(-6deg) scale(1.05); }
      80%  { transform: rotate(5deg) scale(1.02); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes popLand {
      0%   { transform: scale(0.88); }
      60%  { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .rolling {
      animation: diceTumble 0.28s infinite ease-in-out;
    }
    .landed {
      animation: popLand 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 select-none">

  <main class="w-full max-w-xl bg-slate-800/95 border border-slate-700 rounded-3xl shadow-2xl p-6 md:p-9">
    <!-- Fejléc -->
    <div class="text-center mb-6">
      <span class="text-xs font-bold uppercase tracking-widest text-amber-400">6 oldalú kérdéskocka</span>
      <h1 class="text-2xl md:text-3xl font-extrabold text-white mt-1">Kérdőszó Sorsoló</h1>
      <p class="text-xs md:text-sm text-slate-400 mt-1">Minden oldal egyenlő eséllyel sorsolódik ki minden dobásnál</p>
    </div>

    <!-- A 6 oldal gyors áttekintése (világít, amelyik kijön) -->
    <div id="sides-preview" class="grid grid-cols-3 sm:grid-cols-6 gap-1.5 mb-7"></div>

    <!-- NAGY DOBÓKOCKA FELÜLET -->
    <div class="flex justify-center mb-8">
      <div id="dice-face"
        class="w-64 h-64 sm:w-72 sm:h-72 rounded-[2.25rem] bg-gradient-to-br from-indigo-600 via-indigo-700 to-slate-900 border-4 border-indigo-400/70 shadow-2xl shadow-indigo-950/80 flex flex-col items-center justify-center p-6 text-center relative transition-colors duration-200">
        
        <!-- Sarokpöttyök dekorációnak -->
        <span class="w-2.5 h-2.5 rounded-full bg-white/25 absolute top-5 left-5"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-white/25 absolute top-5 right-5"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-white/25 absolute bottom-5 left-5"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-white/25 absolute bottom-5 right-5"></span>

        <span id="dice-side-num" class="text-xs font-bold uppercase tracking-widest text-white/60 mb-2">
          Készen áll
        </span>
        <div id="dice-text" class="text-4xl sm:text-5xl font-black text-white tracking-tight leading-tight">
          ?
        </div>
      </div>
    </div>

    <!-- EXTRA NAGY DOBÁS GOMB -->
    <button id="roll-btn" onclick="rollDice()"
      class="w-full py-6 sm:py-7 px-6 rounded-3xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 active:scale-[0.98] text-slate-950 font-black text-2xl sm:text-3xl tracking-wide shadow-xl shadow-amber-500/25 transition cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
      🎲 DOBÁS
    </button>
    <p class="text-center text-xs text-slate-400 mt-2.5">Kattints a nagy gombra vagy nyomj Szóközt!</p>

    <!-- KORÁBBI DOBÁSOK -->
    <div class="mt-6 pt-4 border-t border-slate-700/80">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Legutóbbi dobások</span>
        <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-rose-400 transition">Törlés</button>
      </div>
      <div id="history-list" class="flex flex-wrap gap-1.5 min-h-[30px] items-center">
        <span class="text-xs text-slate-500 italic">Még nem dobtál.</span>
      </div>
    </div>
  </main>

  <script>
    const SIDES = [
      { num: 1, label: "Ki? / Mi?",   bg: "from-indigo-600 via-indigo-700 to-slate-900", border: "border-indigo-400" },
      { num: 2, label: "Kit? / Mit?", bg: "from-sky-600 via-sky-700 to-slate-900",       border: "border-sky-400" },
      { num: 3, label: "Mikor?",      bg: "from-emerald-600 via-emerald-700 to-slate-900", border: "border-emerald-400" },
      { num: 4, label: "Miért?",      bg: "from-amber-600 via-amber-700 to-slate-900",   border: "border-amber-400" },
      { num: 5, label: "Hol?",        bg: "from-rose-600 via-rose-700 to-slate-900",     border: "border-rose-400" },
      { num: 6, label: "Hogyan?",     bg: "from-purple-600 via-purple-700 to-slate-900", border: "border-purple-400" }
    ];

    let isRolling = false;
    let history = [];

    function renderPreview(activeNum = null) {
      document.getElementById("sides-preview").innerHTML = SIDES.map(s => {
        const isAct = s.num === activeNum;
        return `
          <div class="py-1.5 px-1 rounded-xl text-center text-[11px] font-bold border transition ${
            isAct
              ? "bg-amber-400 text-slate-950 border-amber-300 scale-105 shadow-md"
              : "bg-slate-700/50 text-slate-300 border-slate-700"
          }">
            ${s.label}
          </div>
        `;
      }).join("");
    }

    renderPreview();

    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      const btn = document.getElementById("roll-btn");
      const diceFace = document.getElementById("dice-face");
      const diceText = document.getElementById("dice-text");
      const diceSideNum = document.getElementById("dice-side-num");

      btn.disabled = true;
      btn.textContent = "⏳ Pörög a kocka...";

      diceFace.classList.remove("landed");
      diceFace.classList.add("rolling");
      diceSideNum.textContent = "Sorsolás...";

      // Minden dobásnál független, egyenlő esélyű választás a 6 oldal közül (1/6)
      const chosen = SIDES[Math.floor(Math.random() * SIDES.length)];

      const animInterval = setInterval(() => {
        const temp = SIDES[Math.floor(Math.random() * SIDES.length)];
        diceText.textContent = temp.label;
      }, 75);

      setTimeout(() => {
        clearInterval(animInterval);
        diceFace.classList.remove("rolling");
        void diceFace.offsetWidth; // animáció újraindítása
        diceFace.classList.add("landed");

        diceFace.className = `w-64 h-64 sm:w-72 sm:h-72 rounded-[2.25rem] bg-gradient-to-br ${chosen.bg} border-4 ${chosen.border} shadow-2xl flex flex-col items-center justify-center p-6 text-center relative landed`;
        diceSideNum.textContent = `${chosen.num}. oldal`;
        diceText.textContent = chosen.label;

        renderPreview(chosen.num);

        history.unshift(chosen.label);
        if (history.length > 12) history.pop();
        renderHistory();

        isRolling = false;
        btn.disabled = false;
        btn.textContent = "🎲 DOBÁS";
      }, 850);
    }

    function renderHistory() {
      const container = document.getElementById("history-list");
      if (history.length === 0) {
        container.innerHTML = `<span class="text-xs text-slate-500 italic">Még nem dobtál.</span>`;
        return;
      }
      container.innerHTML = history.map((item, idx) => `
        <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${
          idx === 0
            ? "bg-amber-500/20 text-amber-300 border-amber-400/50"
            : "bg-slate-700/70 text-slate-300 border-slate-600"
        }">${item}</span>
      `).join("");
    }

    function clearHistory() {
      history = [];
      renderHistory();
      renderPreview(null);
      document.getElementById("dice-text").textContent = "?";
      document.getElementById("dice-side-num").textContent = "Készen áll";
    }

    // Szóköz vagy Enter lenyomására is dob
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        rollDice();
      }
    });
  </script>
</body>
</html>
